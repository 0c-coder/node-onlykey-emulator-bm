# Standalone build only (gradlew -p emulator/android ...): the flags ok-edge's
# android/gradle.properties sets, so this module builds alone the way it builds
# inside that host. A host build reads its own root gradle.properties.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
